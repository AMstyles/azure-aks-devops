name: apply-infra

on:
  push:
    branches:
      - main
    paths:
      - "infra-tg/**"
      - ".github/workflows/apply-infra.yaml"

permissions:
  contents: read
  id-token: write

env:
  TERRAGRUNT_WORKING_DIR: environments/prod/southafrica
  TF_VERSION_FILE: infra-tg/.terraform-version
  TG_VERSION_FILE: infra-tg/.terragrunt-version

jobs:
  plan:
    name: Terragrunt Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-tg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/custom-actions/setup-terraform
        with:
          terraform_version_file: ${{ env.TF_VERSION_FILE }}

      - name: Setup Terragrunt
        uses: ./.github/custom-actions/setup-terragrunt
        with:
          terragrunt_version_file: ${{ env.TG_VERSION_FILE }}

      - name: Azure Login (OIDC)
        uses: ./.github/custom-actions/azure-oidc-login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terragrunt Init & Plan
        run: |
          terragrunt run --all init --non-interactive \
            --working-dir ${{ env.TERRAGRUNT_WORKING_DIR }}

          terragrunt run --all plan --non-interactive \
            --working-dir ${{ env.TERRAGRUNT_WORKING_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

  apply:
    name: Terragrunt Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra-tg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/custom-actions/setup-terraform
        with:
          terraform_version_file: ${{ env.TF_VERSION_FILE }}

      - name: Setup Terragrunt
        uses: ./.github/custom-actions/setup-terragrunt
        with:
          terragrunt_version_file: ${{ env.TG_VERSION_FILE }}

      - name: Azure Login (OIDC)
        uses: ./.github/custom-actions/azure-oidc-login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terragrunt Init & Apply
        run: |
          terragrunt run --all init --non-interactive \
            --working-dir ${{ env.TERRAGRUNT_WORKING_DIR }}

          terragrunt run --all apply --non-interactive \
            --working-dir ${{ env.TERRAGRUNT_WORKING_DIR }} -- -auto-approve
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"